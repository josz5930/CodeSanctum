services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: codeattest_migrator
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique local database password}"
      POSTGRES_DB: codeattest
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeattest_migrator -d codeattest"]
      interval: 2s
      timeout: 3s
      retries: 30
