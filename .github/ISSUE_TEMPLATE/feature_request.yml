name: Feature or change proposal
description: Propose an improvement, new capability, or protocol/API change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Proposals are welcome. Note that CodeAttest is protocol-first: new
        artifact fields, states, identities, or event types start in `protocol/`
        (schema + fixture + binding) before adapters consume them. There is no
        commitment to implement any proposal on a timeline — see the
        [Support policy](https://github.com/josz5930/CodeSanctum#support-policy).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and where does the current design get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: >-
        What you would like to see. If it touches evidence semantics, describe
        the protocol/schema impact. If it affects customer-visible output, note
        how it stays within the claim-safety boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
    validations:
      required: false
